<body class="home-page" data-nav-variant="home" data-auth-mode="login">

<header>
  <div class="wrap nav">
    <a class="brand" href="/"><img src="/logo-64.webp" srcset="/logo-64.webp 1x, /logo-128.webp 2x" alt="EpoxyGrind" width="32" height="32" decoding="async"> EpoxyGrind</a>
    <div class="nav-auth" data-auth-nav>
      <a href="/">For contractors</a>
      <a href="/login/">Log in</a>
      <a class="btn btn-p btn-sm" href="/signup/">Sign up</a>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Log in</h1>
    <p>Access saved estimates and contractor tools.</p>
    <div id="oauthBlock">
      <button type="button" class="btn btn-o btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.56 2.95-2.24 5.45-4.78 7.14l7.73 6c4.51-4.16 7.09-10.27 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <div class="auth-divider"><span>or</span></div>
    </div>
    <form id="magicForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required></div>
      <button class="btn btn-p" type="submit">Email me a magic link</button>
    </form>
    <div class="auth-message" id="authMessage" hidden></div>
    <p class="auth-foot">No account yet? <a href="/signup/">Sign up</a></p>
  </div>
</main>

<script src="/js/nav.bundle.js" defer></script>
<script src="/js/form.bundle.js" defer></script>
</body>
</html>
